<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Peg System</title>
    <meta name="description" content="A simple mobile friendly frontend for the Memory Peg System.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <header class="hero-banner">
        <div class="banner-overlay"></div>
        <img src="banner.png" alt="Memory Palace Banner" class="banner-img">
        <div class="banner-content">
            <h1 id="banner-title">Memory Peg System</h1>
            <p id="banner-subtitle">Your daily magical memory palace</p>
        </div>
    </header>

    <main class="container">
        <!-- Dashboard to show /getCharacters data -->
        <section id="dashboard" class="dashboard glass-panel">
            <div class="loader" id="loader"></div>
            <div class="dashboard-content" id="dashboard-content" style="display: none;">
                <div class="card week-card">
                    <div class="card-header">
                        <span class="label">Week <span id="week-num"></span></span>
                        <h2 id="week-creature"></h2>
                    </div>
                    <p id="week-desc" class="desc"></p>
                </div>

                <div class="card day-card">
                    <div class="card-header">
                        <span class="label" id="day-name"></span>
                        <h2 id="day-theme"></h2>
                    </div>
                    <p class="desc"><strong>Props:</strong> <span id="day-props"></span></p>
                </div>

                <div class="card time-card">
                    <div class="card-header">
                        <span class="label" id="computed-time"></span>
                        <h2 id="time-character"></h2>
                        <span class="peg-badge" id="time-peg"></span>
                    </div>
                    <p class="desc">15-minute quadrant character</p>
                </div>
            </div>
            
            <div class="error-message" id="error-message" style="display: none;">
                <p>Failed to load data from the API. Make sure the backend server is running on port 3000.</p>
            </div>
        </section>

        <!-- Stage for learning stuff (Implement later) -->
        <section id="learning-stage" class="learning-stage">
            <div class="glass-panel placeholder-stage">
                <h2>Learning Stage</h2>
                <p>Interactive learning content will be shown here.</p>
                <div class="stage-icon">✨</div>
            </div>
        </section>
    </main>

    <script src="app.js?v=2"></script>
</body>
</html>
