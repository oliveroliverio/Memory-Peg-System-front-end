<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Peg System</title>
    <meta name="description" content="A simple mobile friendly frontend for the Memory Peg System.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <header class="hero-banner">
        <div class="banner-overlay"></div>
        <img src="banner.png" alt="Memory Palace Banner" class="banner-img">
        <div class="banner-content">
            <h1 id="banner-title">Memory Peg System</h1>
            <h3 id="banner-time-character" class="banner-sub-title"></h3>
            <p id="banner-subtitle">Your daily magical memory palace</p>
        </div>
    </header>

    <main class="container">
        <!-- Dashboard to show /getCharacters data -->
        <section id="dashboard" class="dashboard glass-panel">
            <div class="loader" id="loader"></div>
            <div class="dashboard-content" id="dashboard-content" style="display: none;">
                <div class="card week-card">
                    <div class="card-header">
                        <span class="label">Week <span id="week-num"></span></span>
                        <h2 id="week-creature"></h2>
                    </div>
                    <p id="week-desc" class="desc"></p>
                </div>

                <div class="card day-card">
                    <div class="card-header">
                        <span class="label" id="day-name"></span>
                        <h2 id="day-theme"></h2>
                    </div>
                    <p class="desc"><strong>Props:</strong> <span id="day-props"></span></p>
                </div>

                <div class="card time-card">
                    <div class="card-header">
                        <span class="label" id="computed-time"></span>
                        <div class="time-character-row">
                            <h2 id="time-character"></h2>
                            <!-- Analog clock: quadrant sectors highlighted, hands set by JS -->
                            <svg id="quadrant-clock" viewBox="0 0 100 100" class="quadrant-clock" aria-label="Analog clock showing current 15-minute quadrant">
                                <!-- Quadrant sectors (pie slices, active class toggled by JS) -->
                                <!-- Sector 0: :00–:15 (top-right) -->
                                <path id="sector-0" class="quadrant-sector" d="M50,50 L50,7 A43,43 0 0,1 93,50 Z"/>
                                <!-- Sector 1: :15–:30 (bottom-right) -->
                                <path id="sector-1" class="quadrant-sector" d="M50,50 L93,50 A43,43 0 0,1 50,93 Z"/>
                                <!-- Sector 2: :30–:45 (bottom-left) -->
                                <path id="sector-2" class="quadrant-sector" d="M50,50 L50,93 A43,43 0 0,1 7,50 Z"/>
                                <!-- Sector 3: :45–:00 (top-left) -->
                                <path id="sector-3" class="quadrant-sector" d="M50,50 L7,50 A43,43 0 0,1 50,7 Z"/>
                                <!-- Clock rim -->
                                <circle cx="50" cy="50" r="46" class="clock-rim"/>
                                <!-- Quadrant dividers -->
                                <line x1="50" y1="7" x2="50" y2="93" class="quadrant-divider"/>
                                <line x1="7" y1="50" x2="93" y2="50" class="quadrant-divider"/>
                                <!-- Hour markers -->
                                <line x1="50" y1="7" x2="50" y2="13" class="hour-tick"/>
                                <line x1="93" y1="50" x2="87" y2="50" class="hour-tick"/>
                                <line x1="50" y1="93" x2="50" y2="87" class="hour-tick"/>
                                <line x1="7" y1="50" x2="13" y2="50" class="hour-tick"/>
                                <!-- Hour hand -->
                                <line id="clock-hour-hand" x1="50" y1="50" x2="50" y2="30" class="clock-hand hour-hand"/>
                                <!-- Minute hand -->
                                <line id="clock-minute-hand" x1="50" y1="50" x2="50" y2="14" class="clock-hand minute-hand"/>
                                <!-- Center dot -->
                                <circle cx="50" cy="50" r="3.5" class="clock-center"/>
                            </svg>
                        </div>
                        <span class="peg-badge" id="time-peg"></span>
                    </div>
                    <p class="desc">15-minute quadrant character</p>
                </div>
            </div>
            
            <div class="error-message" id="error-message" style="display: none;">
                <p>Failed to load data from the API. Make sure the backend server is running on port 3000.</p>
            </div>
        </section>

        <!-- Stage for learning stuff (Implement later) -->
        <section id="learning-stage" class="learning-stage">
            <div class="glass-panel placeholder-stage">
                <h2>Learning Stage</h2>
                <p>Interactive learning content will be shown here.</p>
                <div class="stage-icon">✨</div>
            </div>
        </section>
    </main>

    <script src="app.js?v=5"></script>
</body>
</html>
